name: Frontend Tests

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "api/src/game-data/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - "api/src/game-data/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Calculator TypeScript check
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./web
        run: npm run lint

      - name: Run tests
        working-directory: ./web
        run: npm test

      - name: Build
        working-directory: ./web
        run: npm run build
